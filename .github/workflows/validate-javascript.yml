name: Validate ClassPet JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)]
            .filter(match => !/\\bsrc\\s*=/.test(match[1]) && match[2].trim());

          if (!scripts.length) {
            throw new Error('Không tìm thấy JavaScript inline trong index.html');
          }

          for (let index = 0; index < scripts.length; index++) {
            const file = `/tmp/classpet-inline-${index}.js`;
            fs.writeFileSync(file, scripts[index][2]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
            console.log(`JavaScript inline #${index + 1}: syntax OK`);
          }
          NODE
